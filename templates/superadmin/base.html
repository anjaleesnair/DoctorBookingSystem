<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SuperAdmin Dashboard{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; min-height: 100vh; }

        .sidebar {
            width: 240px; background: #1a237e; color: white;
            padding: 30px 0; position: fixed; height: 100vh;
        }
        .sidebar h2 { text-align: center; font-size: 18px; margin-bottom: 30px; padding: 0 20px; }
        .sidebar a {
            display: block; padding: 14px 24px; color: #c5cae9;
            text-decoration: none; font-size: 15px; transition: background 0.2s;
        }
        .sidebar a:hover, .sidebar a.active { background: #283593; color: white; }

        .main { margin-left: 240px; padding: 30px; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .header h1 { font-size: 24px; color: #1a237e; }
        .logout-btn {
            background: #e53935; color: white; border: none;
            padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px;
        }

        .card { background: white; border-radius: 10px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        .card h3 { font-size: 17px; color: #333; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #e8eaf6; color: #283593; padding: 10px 14px; text-align: left; }
        td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; color: #444; }
        tr:hover td { background: #fafafa; }

        .badge {
            padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
        }
        .badge-pending { background: #fff3e0; color: #e65100; }
        .badge-approved { background: #e8f5e9; color: #2e7d32; }
        .badge-rejected { background: #fce4ec; color: #c62828; }

        .btn { padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-approve { background: #43a047; color: white; }
        .btn-reject { background: #e53935; color: white; margin-left: 6px; }
        .btn-edit { background: #1e88e5; color: white; }
        .btn-delete { background: #e53935; color: white; margin-left: 6px; }
        .btn-primary { background: #1a237e; color: white; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 9px 12px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 14px; color: #333;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .alert { padding: 12px 18px; border-radius: 6px; margin-bottom: 18px; font-size: 14px; }
        .alert-success { background: #e8f5e9; color: #2e7d32; }
        .alert-error { background: #fce4ec; color: #c62828; }

        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 12px; padding: 28px; width: 480px; max-width: 95vw; }
        .modal h3 { margin-bottom: 20px; color: #1a237e; }
    </style>
</head>
<body>
<div class="sidebar">
    <h2>🏥 Admin Panel</h2>
    <a href="{% url 'superadmin-dashboard' %}" class="{% block nav_dash %}{% endblock %}">📊 Dashboard</a>
    <a href="{% url 'superadmin-doctors' %}" class="{% block nav_doctors %}{% endblock %}">👨‍⚕️ Doctors</a>
    <a href="{% url 'superadmin-leaves' %}" class="{% block nav_leaves %}{% endblock %}">📋 Leave Requests</a>
</div>
<div class="main">
    <div class="header">
        <h1>{% block title_display %}Dashboard{% endblock %}</h1>
        <form method="POST" action="{% url 'superadmin-logout' %}">
            {% csrf_token %}
            <button class="logout-btn">Logout</button>
        </form>
    </div>
    {% block content %}{% endblock %}
</div>
</body>
</html>
